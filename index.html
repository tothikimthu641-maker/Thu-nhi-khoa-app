<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhi Khoa Lâm Sàng - Tra Cứu Tốc Độ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between" x-data="app()">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 p-4 border-b border-blue-800 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <span class="text-pink-500">❤️</span> Nhi Khoa Lâm Sàng
                </h1>
                <p class="text-xs text-blue-300">Tra cứu Dược lực • Phác đồ • Bù Điện giải & Vận mạch</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-emerald-600 px-2 py-1 rounded font-mono">OFFLINE READY</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full space-y-4">
        
        <!-- Ô TÌM KIẾM & PHÂN LOẠI NHÓM THUỐC -->
        <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 shadow space-y-3">
            <div class="relative">
                <input type="text" x-model="search" placeholder="Tìm tên thuốc, liều dùng, dung môi, ghi chú..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>

            <!-- TAB PHÂN LOẠI NHÓM -->
            <div class="flex flex-wrap gap-1.5 pt-1">
                <button @click="selectedCategory = 'TẤT CẢ'" 
                        :class="selectedCategory === 'TẤT CẢ' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
                        class="text-xs px-3 py-1.5 rounded-lg font-medium transition">Tất cả</button>
                <template x-for="cat in categories" :key="cat">
                    <button @click="selectedCategory = (selectedCategory === cat ? 'TẤT CẢ' : cat)"
                            :class="selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
                            class="text-xs px-3 py-1.5 rounded-lg font-medium transition" x-text="cat"></button>
                </template>
            </div>
        </div>

        <!-- DANH SÁCH THUỐC KẾT QUẢ -->
        <div class="space-y-4">
            <template x-for="item in filteredDrugs" :key="item.id">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md hover:border-slate-600 transition">
                    <div class="flex justify-between items-start border-b border-slate-700 pb-2 mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-blue-400" x-text="item.name"></h3>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <span class="text-xs bg-indigo-900 text-indigo-200 px-2.5 py-0.5 rounded-full font-medium" x-text="item.category"></span>
                                <span x-show="item.brand" class="text-xs bg-slate-700 text-amber-300 px-2 py-0.5 rounded" x-text="item.brand"></span>
                            </div>
                        </div>
                    </div>

                    <!-- BẢNG CHI TIẾT LIỀU & CÁCH PHA -->
                    <div class="overflow-x-auto my-2">
                        <table class="w-full text-xs text-left border-collapse border border-slate-700">
                            <tbody>
                                <tr x-show="item.dosage" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300 w-1/4">Liều dùng & Chỉ định</td>
                                    <td class="p-2 text-slate-200 whitespace-pre-line" x-text="item.dosage"></td>
                                </tr>
                                <tr x-show="item.preparation" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Cách pha & Dung môi</td>
                                    <td class="p-2 text-slate-200 whitespace-pre-line" x-text="item.preparation"></td>
                                </tr>
                                <tr x-show="item.stability" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Độ ổn định / Bảo quản</td>
                                    <td class="p-2 text-slate-200 whitespace-pre-line" x-text="item.stability"></td>
                                </tr>
                                <tr x-show="item.adjustment">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Chỉnh liều (Thận/Gan)</td>
                                    <td class="p-2 text-slate-200 whitespace-pre-line" x-text="item.adjustment"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- CHÚ THÍCH LÂM SÀNG -->
                    <div x-show="item.notes" class="mt-3 text-xs bg-slate-900/90 p-2.5 rounded-lg border border-slate-700/60 text-slate-300">
                        <strong class="text-amber-400">💡 Lưu ý lâm sàng:</strong> <span class="whitespace-pre-line" x-text="item.notes"></span>
                    </div>
                </div>
            </template>

            <!-- THÔNG BÁO KHI KHÔNG TÌM THẤY -->
            <div x-show="filteredDrugs.length === 0" class="text-center py-8 text-slate-400 text-sm">
                Không tìm thấy dữ liệu thuốc phù hợp với từ khóa tìm kiếm.
            </div>
        </div>
    </main>

    <!-- FOOTER NAVBAR -->
    <nav class="bg-slate-900 border-t border-slate-800 py-3 px-6 sticky bottom-0 z-50">
        <div class="max-w-md mx-auto flex justify-between text-xs text-slate-400">
            <button class="flex flex-col items-center hover:text-blue-400"><span>📋</span>SBAR</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>🔍</span>Tiếp cận</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>⚡</span>Phác đồ</button>
            <button class="flex flex-col items-center text-blue-400 font-semibold"><span>💊</span>Thuốc</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>🧪</span>Cận lâm sàng</button>
        </div>
    </nav>

    <!-- LOGIC VÀ CƠ SỞ DỮ LIỆU THUỐC CHI TIẾT -->
    <script>
        function app() {
            return {
                search: '',
                selectedCategory: 'TẤT CẢ',
                categories: ['AN THẦN - GIÃN CƠ', 'ĐIỆN GIẢI', 'KHÁNG SINH', 'VẬN MẠCH', 'THUỐC KHÁC'],
                drugs: [
                    // ==========================================
                    // 1. AN THẦN - GIÃN CƠ
                    // ==========================================
                    {
                        id: 'diazepam',
                        name: 'Diazepam 0,01g/2ml (Ống 2ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Seduxen, Valium - Benzodiazepin',
                        dosage: 'Cắt cơn co giật: 0.2 - 0.3 mg/kg IV chậm (1-2 mg/phút). Hoặc bơm hậu môn 0.5 mg/kg.',
                        preparation: 'Tiêm TM trực tiếp nguyên chất. Không khuyến cáo pha loãng vào dịch truyền do nguy cơ kết tủa.',
                        stability: 'Bảo quản nhiệt độ phòng (15-30°C), tránh ánh sáng.',
                        adjustment: 'Giảm 50% liều ở bệnh nhân suy gan nặng.',
                        notes: 'Nguy cơ ức chế hô hấp và tụt huyết áp cao khi tiêm TM nhanh. Luôn chuẩn bị sẵn bóng Ambu/O2.'
                    },
                    {
                        id: 'fentanyl',
                        name: 'Fentanyl 0,1mg/2ml (Ống 2ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Fentanyl - Opioid',
                        dosage: 'Giảm đau / An thần: 1 - 2 mcg/kg IV bolus. Duy trì truyền TM: 1 - 3 mcg/kg/giờ.',
                        preparation: 'Pha với NaCl 0.9% hoặc D5% đạt nồng độ 10 mcg/ml hoặc 50 mcg/ml.',
                        stability: 'Ổn định 24h ở nhiệt độ phòng sau khi pha.',
                        adjustment: 'Giảm 25-50% liều khi GFR < 10 ml/phút.',
                        notes: 'Tiêm bolus quá nhanh gây cứng cơ thành ngực (Rigid chest). Chuẩn bị sẵn Naloxone giải độc.'
                    },
                    {
                        id: 'midazolam',
                        name: 'Midazolam 5mg/ml (Ống 1ml/3ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Dormicum',
                        dosage: 'An thần đặt NKQ: 0.1 - 0.2 mg/kg IV. Duy trì truyền: 1 - 6 mcg/kg/phút (0.06 - 0.36 mg/kg/giờ).',
                        preparation: 'Pha loãng trong NaCl 0.9% hoặc D5% đạt nồng độ 1 mg/ml.',
                        stability: 'Bảo quản nhiệt độ phòng, ổn định 24h sau khi pha.',
                        adjustment: 'Thận trọng và giảm liều khi suy gan/suy thận.',
                        notes: 'Tác dụng an thần ngắn, nguy cơ tụt huyết áp cao khi phối hợp Opioid.'
                    },
                    {
                        id: 'rocuronium',
                        name: 'Rocuronium 50mg/5ml',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Esmeron - Giãn cơ không khử cực',
                        dosage: 'Đặt NKQ nhanh: 0.6 - 1.2 mg/kg IV. Duy trì truyền: 0.3 - 0.6 mg/kg/giờ.',
                        preparation: 'Pha trong NaCl 0.9% hoặc D5%.',
                        stability: 'Bảo quản lạnh 2-8°C. Để nhiệt độ phòng dùng trong 12 tuần.',
                        adjustment: 'Kéo dài thời gian tác dụng ở bệnh nhân suy gan, xơ gan.',
                        notes: 'BẮT BUỘC phải thông khí nhân tạo. Hóa giải tác dụng bằng Sugammadex hoặc Neostigmine.'
                    },

                    // ==========================================
                    // 2. ĐIỆN GIẢI
                    // ==========================================
                    {
                        id: 'kcl-10',
                        name: 'Kali Chloride (KCl) 10%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Ống 10ml (1g = 13.4 mEq K+)',
                        dosage: 'Nhu cầu cơ bản: 2-3 mEq/kg/ngày.\nBù Hạ K+ máu: 0.5 - 1 mEq/kg truyền TM trong 1-2h (Max 40-80 mEq/L ngoại biên).',
                        preparation: 'TUYỆT ĐỐI KHÔNG TIÊM TRỰC TIẾP. Pha loãng vào chai NaCl 0.9% hoặc D5%. Tính nhanh: Bù 40 mEq/L -> Pha 30ml KCl 10% vào 1000ml dịch.',
                        stability: 'Bảo quản nhiệt độ phòng.',
                        adjustment: 'CHỐNG CHỈ ĐỊNH khi vô niệu, suy thận cấp, tăng Kali máu.',
                        notes: 'CẢNH BÁO AN TOÀN: Tiêm tĩnh mạch trực tiếp gây NGỪNG TIM TỬ VONG tức thì! Luôn lắc đều chai dịch sau khi pha.'
                    },
                    {
                        id: 'natri-bicarbonat',
                        name: 'Natri Bicarbonat 4.2% / 8.4%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Chai / Ống (1 ml 8.4% = 1 mEq Na+ & HCO3-)',
                        dosage: 'Toan chuyển hóa nặng (pH < 7.1) / Tăng Kali máu cấp: 1 - 2 mEq/kg IV chậm trong 5-10 phút.',
                        preparation: 'Trẻ sơ sinh/sơ sinh non: Pha loãng 8.4% với nước cất tỉ lệ 1:1 thành 4.2% (đẳng trương) để tránh xuất huyết não.',
                        stability: 'Không pha chung với Calcium (gây kết tủa Calcium carbonate).',
                        adjustment: 'Theo dõi sát Khí máu động mạch và Natri máu.',
                        notes: 'Không dùng chung đường truyền với Catecholamin (Adrenalin, Noradrenalin) vì làm trơ thuốc.'
                    },
                    {
                        id: 'calci-gluconat',
                        name: 'Calci Gluconat 10%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Ống 10ml (0.46 mEq Ca2+/ml)',
                        dosage: 'Cấp cứu Tăng K+ máu / Hạ Ca2+ máu cấp: 0.5 - 1 ml/kg (Max 20ml) IV chậm 5-10 phút.',
                        preparation: 'Pha loãng với D5% hoặc NaCl 0.9% tỉ lệ 1:1.',
                        stability: 'Bảo quản nhiệt độ phòng.',
                        adjustment: 'Thận trọng trên bệnh nhân đang điều trị Digoxin.',
                        notes: 'Tiêm TM chậm, theo dõi nhịp tim (nguy cơ chậm nhịp/ngừng tim). Tránh thoát mạch gây hoại tử mô nặng.'
                    },

                    // ==========================================
                    // 3. KHÁNG SINH
                    // ==========================================
                    {
                        id: 'vancomycin',
                        name: 'Vancomycin 500mg / 1g',
                        category: 'KHÁNG SINH',
                        brand: 'Vancocin - Glycopeptide',
                        dosage: 'Trẻ em: 40 - 60 mg/kg/ngày chia 3-4 lần (mỗi 6-8h). Viêm màng não: 60 mg/kg/ngày.',
                        preparation: 'Pha lọ 500mg với 10ml nước cất. Pha loãng vào NaCl 0.9% hoặc D5% đạt nồng độ <= 5 mg/ml. Truyền TM chậm > 60 phút.',
                        stability: 'Sau pha hoàn nguyên ổn định 14 ngày trong tủ lạnh (2-8°C). Dịch truyền dùng trong 24h.',
                        adjustment: 'BẮT BUỘC chỉnh liều theo Mức lọc cầu thận (GFR) và Trough level (15-20 mcg/ml).',
                        notes: 'Truyền nhanh gây Hội chứng người đỏ (Red Man Syndrome). Theo dõi sát chức năng thận và thính lực.'
                    },
                    {
                        id: 'ceftriaxone',
                        name: 'Ceftriaxone 1g',
                        category: 'KHÁNG SINH',
                        brand: 'Rocephin - Cephalosporin thế hệ 3',
                        dosage: 'Nhiễm trùng thường: 50 - 80 mg/kg/ngày 1 lần. Viêm màng não: 100 mg/kg/ngày chia 1-2 lần.',
                        preparation: 'Pha tiêm TM chậm 3-5 phút hoặc pha truyền TM trong 30 phút với NaCl 0.9% hoặc D5%.',
                        stability: 'Dung dịch sau pha ổn định 24h ở nhiệt độ phòng, 3 ngày trong tủ lạnh.',
                        adjustment: 'Không cần chỉnh liều trong suy thận đơn thuần.',
                        notes: 'CHỐNG CHỈ ĐỊNH dùng chung hoặc pha cùng dịch truyền chứa CALCI (như Ringer Lactate) ở trẻ sơ sinh.'
                    },

                    // ==========================================
                    // 4. VẬN MẠCH
                    // ==========================================
                    {
                        id: 'noradrenaline',
                        name: 'Noradrenaline (Norepinephrine) 1mg/ml',
                        category: 'VẬN MẠCH',
                        brand: 'Levophed',
                        dosage: 'Khởi đầu: 0.05 - 0.1 mcg/kg/phút. Tăng dần mỗi 5-10 phút đạt MAP mục tiêu. Liều tối đa: 1-2 mcg/kg/phút.',
                        preparation: 'Pha trong D5% hoặc NaCl 0.9%. Công thức pha bơm tiêm điện: 4mg (1 ống) + D5% vừa đủ 50ml (Nồng độ 80 mcg/ml).',
                        stability: 'Tránh ánh sáng. Không dùng nếu dung dịch đổi màu hồng hoặc nâu.',
                        adjustment: 'Chỉnh liều liên tục theo đáp ứng Huyết áp động mạch xâm nhập.',
                        notes: 'Lựa chọn HÀNG ĐẦU trong Sốc nhiễm khuẩn. Ưu tiên truyền qua đường TĨNH MẠCH TRUNG TÂM tránh hoại tử.'
                    },
                    {
                        id: 'adrenaline-vm',
                        name: 'Adrenaline (Epinephrine) 1mg/1ml',
                        category: 'VẬN MẠCH',
                        brand: 'Adrenalin',
                        dosage: 'Sốc tim/Sốc phân bố: Truyền TM 0.02 - 0.5 mcg/kg/phút.\nPhản vệ: Tiêm bắp 0.01 mg/kg (1/1000) đùi ngoài.',
                        preparation: 'Pha truyền Bơm tiêm điện bằng Glucose 5% hoặc NaCl 0.9%.',
                        stability: 'Bảo quản nhiệt độ phòng, tránh ánh sáng.',
                        adjustment: 'Chỉnh liều theo Huyết áp và Nhịp tim.',
                        notes: 'Liều thấp (0.02-0.08) ưu tiên Beta-1, Beta-2. Liều cao (>0.1) co mạch Alpha-1 mạnh.'
                    },

                    // ==========================================
                    // 5. THUỐC KHÁC
                    // ==========================================
                    {
                        id: 'furosemide',
                        name: 'Furosemide 20mg/2ml',
                        category: 'THUỐC KHÁC',
                        brand: 'Lasix - Lợi tiểu quai',
                        dosage: 'Lợi tiểu cấp: 1 mg/kg/lần IV bolus chậm. Truyền duy trì: 0.1 - 0.4 mg/kg/giờ.',
                        preparation: 'Tiêm TM trực tiếp nguyên chất hoặc pha với NaCl 0.9%. Không pha dịch pH axit (D5%).',
                        stability: 'Bảo quản tránh ánh sáng.',
                        adjustment: 'Chỉnh liều khi suy thận nặng.',
                        notes: 'Theo dõi sát Điện giải đồ (Hạ K+, Hạ Na+) và thể tích nước tiểu.'
                    },
                    {
                        id: 'salbutamol-khiduong',
                        name: 'Salbutamol 2.5mg/2.5ml (Khí dung)',
                        category: 'THUỐC KHÁCH',
                        brand: 'Ventolin Nebules',
                        dosage: 'Cơn hen cấp / Cơn co thắt phế quản: Trẻ < 5 tuổi: 2.5mg/lần; Trẻ >= 5 tuổi: 5mg/lần. Lặp lại mỗi 20 phút x 3 lần nếu nặng.',
                        preparation: 'Dùng trực tiếp dung dịch khí dung nguyên chất qua máy phun khí dung thở O2 (6-8 L/phút).',
                        stability: 'Bảo quản nhiệt độ phòng, trong túi nhôm tránh ánh sáng.',
                        adjustment: 'Không cần chỉnh liều.',
                        notes: 'Tác dụng phụ: Nhịp tim nhanh, run tay, hạ Kali máu.'
                    }
                ],
                get filteredDrugs() {
                    return this.drugs.filter(item => {
                        let searchLower = this.search.toLowerCase();
                        let matchesSearch = item.name.toLowerCase().includes(searchLower) || 
                                          item.category.toLowerCase().includes(searchLower) ||
                                          (item.brand && item.brand.toLowerCase().includes(searchLower)) ||
                                          (item.dosage && item.dosage.toLowerCase().includes(searchLower)) ||
                                          (item.notes && item.notes.toLowerCase().includes(searchLower));
                        
                        let matchesCategory = this.selectedCategory === 'TẤT CẢ' || item.category === this.selectedCategory;
                        
                        return matchesSearch && matchesCategory;
                    });
                }
            }
        }
    </script>
</body>
</html>
