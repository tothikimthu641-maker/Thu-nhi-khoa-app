<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhi Khoa Lâm Sàng - Tra Cứu Dược Lực & Phác Đồ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between" x-data="app()">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 p-4 border-b border-blue-800 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <span class="text-pink-500">❤️</span> Nhi Khoa Lâm Sàng
                </h1>
                <p class="text-xs text-blue-300">Tra cứu Dược chất • Phác đồ • An toàn người bệnh</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-emerald-600 px-2 py-1 rounded font-mono">OFFLINE READY</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full space-y-4">
        
        <!-- Ô TÌM KIẾM & BỘ LỌC DÂN MỤC -->
        <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 shadow space-y-3">
            <div class="relative">
                <input type="text" x-model="search" placeholder="Tìm kiếm thuốc, liều lượng, hoạt chất, ghi chú..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>

            <!-- TAB PHÂN LOẠI NHÓM THUỐC -->
            <div class="flex flex-wrap gap-1.5 pt-1">
                <button @click="selectedCategory = 'TẤT CẢ'" 
                        :class="selectedCategory === 'TẤT CẢ' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
                        class="text-xs px-3 py-1.5 rounded-lg font-medium transition">Tất cả</button>
                <template x-for="cat in categories" :key="cat">
                    <button @click="selectedCategory = (selectedCategory === cat ? 'TẤT CẢ' : cat)"
                            :class="selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
                            class="text-xs px-3 py-1.5 rounded-lg font-medium transition" x-text="cat"></button>
                </template>
            </div>
        </div>

        <!-- DANH SÁCH THUỐC LỌC ĐƯỢC -->
        <div class="space-y-4">
            <template x-for="item in filteredDrugs" :key="item.id">
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md hover:border-slate-600 transition">
                    <div class="flex justify-between items-start border-b border-slate-700 pb-2 mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-blue-400" x-text="item.name"></h3>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <span class="text-xs bg-indigo-900 text-indigo-200 px-2.5 py-0.5 rounded-full font-medium" x-text="item.category"></span>
                                <span x-show="item.brand" class="text-xs bg-slate-700 text-amber-300 px-2 py-0.5 rounded" x-text="'Thương mại: ' + item.brand"></span>
                            </div>
                        </div>
                    </div>

                    <!-- BẢNG CHI TIẾT LIỀU & PHA TIÊM -->
                    <div class="overflow-x-auto my-2">
                        <table class="w-full text-xs text-left border-collapse border border-slate-700">
                            <tbody>
                                <tr x-show="item.dosage" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300 w-1/4">Liều dùng</td>
                                    <td class="p-2 text-slate-200" x-text="item.dosage"></td>
                                </tr>
                                <tr x-show="item.preparation" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Pha tiêm / Dung môi</td>
                                    <td class="p-2 text-slate-200" x-text="item.preparation"></td>
                                </tr>
                                <tr x-show="item.stability" class="border-b border-slate-700">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Độ ổn định hóa lý</td>
                                    <td class="p-2 text-slate-200" x-text="item.stability"></td>
                                </tr>
                                <tr x-show="item.adjustment">
                                    <td class="p-2 bg-slate-700/50 font-semibold text-blue-300">Chỉnh liều (Thận/Gan)</td>
                                    <td class="p-2 text-slate-200" x-text="item.adjustment"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- CHÚ THÍCH & LƯU Ý LÂM SÀNG -->
                    <div x-show="item.notes" class="mt-3 text-xs bg-slate-900/90 p-2.5 rounded-lg border border-slate-700/60 text-slate-300">
                        <strong class="text-amber-400">💡 Lưu ý lâm sàng:</strong> <span x-text="item.notes"></span>
                    </div>
                </div>
            </template>

            <!-- THÔNG BÁO KHI KHÔNG TÌM THẤY THUỐC -->
            <div x-show="filteredDrugs.length === 0" class="text-center py-8 text-slate-400 text-sm">
                Không tìm thấy thuốc hoặc phác đồ phù hợp.
            </div>
        </div>
    </main>

    <!-- FOOTER NAVIGATION BAR -->
    <nav class="bg-slate-900 border-t border-slate-800 py-3 px-6 sticky bottom-0 z-50">
        <div class="max-w-md mx-auto flex justify-between text-xs text-slate-400">
            <button class="flex flex-col items-center hover:text-blue-400"><span>📋</span>SBAR</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>🔍</span>Tiếp cận</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>⚡</span>Phác đồ</button>
            <button class="flex flex-col items-center text-blue-400 font-semibold"><span>💊</span>Thuốc</button>
            <button class="flex flex-col items-center hover:text-blue-400"><span>🧪</span>Cận lâm sàng</button>
        </div>
    </nav>

    <!-- KỊCH BẢN XỬ LÝ DỮ LIỆU THUỐC -->
    <script>
        function app() {
            return {
                search: '',
                selectedCategory: 'TẤT CẢ',
                categories: ['AN THẦN - GIÃN CƠ', 'ĐIỆN GIẢI', 'KHÁNG SINH', 'VẬN MẠCH', 'THUỐC KHÁC'],
                drugs: [
                    // --- 1. AN THẦN - GIÃN CƠ ---
                    {
                        id: 'diazepam',
                        name: 'Diazepam 0,01g/2ml (Ống 2ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Valium, Seduxen',
                        dosage: 'Cắt cơn co giật: 0.2 - 0.3 mg/kg tiêm tĩnh mạch chậm (tối đa 0.5 mg/min). Hoặc bơm hậu môn 0.5 mg/kg.',
                        preparation: 'Không pha loãng với các dung dịch tiêm truyền khác do dễ kết tủa. Tiêm trực tiếp TMMC.',
                        stability: 'Bảo quản nhiệt độ phòng, tránh ánh sáng.',
                        adjustment: 'Giảm liều ở bệnh nhân suy gan nặng.',
                        notes: 'Theo dõi sát nhịp thở, nguy cơ ức chế hô hấp và tụt huyết áp khi tiêm nhanh.'
                    },
                    {
                        id: 'fentanyl',
                        name: 'Fentanyl 0,1mg/2ml (Ống 2ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Fentanyl',
                        dosage: 'An thần / Giảm đau: 1 - 2 mcg/kg tiêm tĩnh mạch. Truyền duy trì: 1 - 3 mcg/kg/giờ.',
                        preparation: 'Pha loãng với NaCl 0.9% hoặc Glucose 5% đến nồng độ 10 mcg/ml hoặc 50 mcg/ml.',
                        stability: 'Bảo quản nhiệt độ 15-30°C, tránh ánh sáng.',
                        adjustment: 'Chỉnh liều theo mức lọc cầu thận nếu GFR < 10 ml/phút.',
                        notes: 'Tiêm quá nhanh có thể gây cứng thành ngực (Rigid chest syndrome). Có sẵn Naloxone để hóa giải khi cần.'
                    },
                    {
                        id: 'midazolam',
                        name: 'Midazolam 5mg/ml (Ống 3ml / 1ml)',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Dormicum',
                        dosage: 'An thần: 0.05 - 0.15 mg/kg tiêm TM. Duy trì truyền TM: 1 - 6 mcg/kg/phút (0.06 - 0.36 mg/kg/giờ).',
                        preparation: 'Pha với NaCl 0.9% hoặc D5% đạt nồng độ 1 mg/ml.',
                        stability: 'Tương hợp với NaCl 0.9%, D5%. Ổn định 24h ở nhiệt độ phòng.',
                        adjustment: 'Thận trọng trong suy gan, suy thận.',
                        notes: 'An thần tác dụng ngắn, nguy cơ tụt huyết áp khi dùng phối hợp Opioid.'
                    },
                    {
                        id: 'rocuronium',
                        name: 'Rocuronium 50mg/5ml',
                        category: 'AN THẦN - GIÃN CƠ',
                        brand: 'Esmeron',
                        dosage: 'Đặt nội khí quản: 0.6 - 1.2 mg/kg. Duy trì truyền: 0.3 - 0.6 mg/kg/giờ.',
                        preparation: 'Pha trong NaCl 0.9% hoặc G5%.',
                        stability: 'Bảo quản lạnh 2 - 8°C. Sau khi rút ra khỏi tủ lạnh ổn định 12 tuần.',
                        adjustment: 'Kéo dài tác dụng ở bệnh nhân suy gan, bệnh lý đường mật.',
                        notes: 'Thuốc giãn cơ không khử cực. BẮT BUỘC phải thông khí nhân tạo và có sẵn Sugammadex hoặc Neostigmine để hóa giải.'
                    },

                    // --- 2. ĐIỆN GIẢI ---
                    {
                        id: 'kcl-10',
                        name: 'Kali Chloride (KCl) 10%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Ống 10ml (1g KCl)',
                        dosage: 'Bù Kali TM: 0.25 - 0.5 mEq/kg/giờ truyền trong 1-2 giờ. Tối đa 1 mEq/kg/giờ (cần theo dõi ECG liên tục).',
                        preparation: 'KHÔNG TIÊM TRỰC TIẾP. Pha loãng vào dịch truyền (NaCl 0.9% hoặc D5%) sao cho nồng độ không quá 40-60 mEq/L (qua tĩnh mạch ngoại biên).',
                        stability: 'Ổn định sau khi pha trong dịch truyền tĩnh mạch.',
                        adjustment: 'Chống chỉ định/giảm liều nghiêm ngặt khi suy thận oliguria/anuria, tăng kali máu.',
                        notes: 'CẢNH BÁO NGHĨA VỤ AN TOÀN: Tiêm trực tiếp gây ngừng tim tử vong ngay lập tức! Luôn xả đều dịch sau khi pha.'
                    },
                    {
                        id: 'natri-bicarbonat',
                        name: 'Natri Bicarbonat 8.4%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Chai / Ống 8.4% (1mEq/ml)',
                        dosage: 'Cấp cứu Toan chuyển hóa nặng / Tăng Kali máu: 1 - 2 mEq/kg tiêm TM chậm hoặc pha truyền.',
                        preparation: 'Pha loãng 1:1 với nước cất hoặc D5% đối với trẻ sơ sinh/trẻ nhỏ (để đạt dung dịch đẳng trương 4.2%).',
                        stability: 'Không trộn lẫn với Calcium chloride/gluconate (gây kết tủa).',
                        adjustment: 'Theo dõi khí máu động mạch và điện giải đồ.',
                        notes: 'Không pha chung với catecholamin (Adrenalin, Noradrenalin) vì làm bất hoạt thuốc.'
                    },
                    {
                        id: 'calci-gluconat',
                        name: 'Calci Gluconat 10%',
                        category: 'ĐIỆN GIẢI',
                        brand: 'Ống 10ml',
                        dosage: 'Hạ Calci máu / Tăng Kali máu cấp cứu: 0.5 - 1 ml/kg (10%) tiêm TM chậm trong 5 - 10 phút.',
                        preparation: 'Pha loãng với D5% hoặc NaCl 0.9% tỉ lệ 1:1 hoặc 1:2.',
                        stability: 'Không pha cùng dung dịch chứa Phosphate hoặc Bicarbonate.',
                        adjustment: 'Thận trọng khi dùng cho bệnh nhân đang điều trị Digoxin.',
                        notes: 'Tiêm TM thật chậm, theo dõi nhịp tim (nguy cơ ngừng tim nếu tiêm nhanh). Tránh thoát mạch gây hoại tử mô.'
                    },

                    // --- 3. KHÁNG SINH ---
                    {
                        id: 'vancomycin',
                        name: 'Vancomycin 500mg / 1g',
                        category: 'KHÁNG SINH',
                        brand: 'Vancocin, Vancomycin',
                        dosage: 'Trẻ em: 40 - 60 mg/kg/ngày chia 4 lần (mỗi 6h) hoặc chia 3 lần (mỗi 8h).',
                        preparation: 'Hoàn nguyên lọ 500mg với 10ml nước cất. Sau đó pha loãng vào NaCl 0.9% hoặc D5% đạt nồng độ <= 5 mg/ml. Truyền TM chậm trong ít nhất 60 phút.',
                        stability: 'Dung dịch sau hoàn nguyên ổn định 14 ngày trong tủ lạnh (2-8°C). Dịch truyền ổn định 24h ở nhiệt độ phòng.',
                        adjustment: 'BẮT BUỘC chỉnh liều theo Mức lọc cầu thận (GFR) và nồng độ đáy (Trough level).',
                        notes: 'Truyền nhanh gây hội chứng người đỏ (Red Man Syndrome) và tụt huyết áp. Theo dõi chức năng thận và thính lực.'
                    },
                    {
                        id: 'ceftriaxone',
                        name: 'Ceftriaxone 1g',
                        category: 'KHÁNG SINH',
                        brand: 'Rocephin, Ceftriaxone',
                        dosage: 'Nhiễm trùng thông thường: 50 - 80 mg/kg/ngày. Viêm màng não: 100 mg/kg/ngày (tối đa 4g/ngày).',
                        preparation: 'Pha tiêm TM: Hoàn nguyên với nước cất tiêm, truyền TM trong 30 phút.',
                        stability: 'Sau khi pha ổn định 24h ở nhiệt độ phòng, 3 ngày trong tủ lạnh.',
                        adjustment: 'Không cần chỉnh liều nếu chỉ suy thận đơn thuần (trừ khi suy cả gan và thận nặng).',
                        notes: 'CHỐNG CHỈ ĐỊNH tuyệt đối phối hợp hoặc truyền cùng đường truyền với dung dịch chứa CALCI (như Ringer Lactate) ở trẻ sơ sinh.'
                    },

                    // --- 4. VẬN MẠCH ---
                    {
                        id: 'noradrenaline',
                        name: 'Noradrenaline (Norepinephrine) 1mg/ml',
                        category: 'VẬN MẠCH',
                        brand: 'Levophed, Noradrenaline',
                        dosage: 'Khởi đầu: 0.05 - 0.1 mcg/kg/phút. Tăng dần mỗi 5-10 phút đến khi đạt MAP mục tiêu. Liều tối đa: 1 - 2 mcg/kg/phút.',
                        preparation: 'Pha trong Glucose 5% (hoặc NaCl 0.9%). Pha 1 amp (4mg/4ml) + 46ml D5% = 50ml (nồng độ 80 mcg/ml).',
                        stability: 'Tránh ánh sáng. Không dùng nếu dung dịch chuyển màu hồng hoặc nâu.',
                        adjustment: 'Chỉnh liều cấp qua bơm tiêm điện theo đáp ứng huyết áp.',
                        notes: 'Thuốc co mạch mạnh hàng đầu trong Sốc nhiễm khuẩn. Ưu tiên truyền qua đường TĨNH MẠCH TRUNG TÂM.'
                    },
                    {
                        id: 'adrenaline-vm',
                        name: 'Adrenaline (Epinephrine) 1mg/1ml',
                        category: 'VẬN MẠCH',
                        brand: 'Adrenalin',
                        dosage: 'Sốc tim / Sốc nhiễm khuẩn: Truyền TM 0.02 - 0.5 mcg/kg/phút. Phản vệ: Tiêm bắp 0.01 mg/kg (1/1000).',
                        preparation: 'Pha trong D5% hoặc NaCl 0.9% bằng Bơm tiêm điện.',
                        stability: 'Bảo quản tránh ánh sáng.',
                        adjustment: 'Chỉnh liều theo đáp ứng lâm sàng và HA.',
                        notes: 'Liều thấp ưu tiên tác dụng beta-1, beta-2. Liều cao co mạch alpha-1 mạnh.'
                    },

                    // --- 5. THUỐC KHÁC ---
                    {
                        id: 'furosemide',
                        name: 'Furosemide 20mg/2ml',
                        category: 'THUỐC KHÁCH',
                        brand: 'Lasix',
                        dosage: 'Lợi tiểu: 0.5 - 1 mg/kg/lần tiêm TM chậm. Tối đa 2 mg/kg/lần.',
                        preparation: 'Tiêm TM trực tiếp chậm trong 1-2 phút hoặc pha truyền trong NaCl 0.9%. Không pha với dịch có pH axít.',
                        stability: 'Bảo quản ở nhiệt độ phòng, tránh ánh sáng.',
                        adjustment: 'Chỉnh liều ở bệnh nhân suy thận nặng.',
                        notes: 'Theo dõi điện giải đồ (nguy cơ hạ Kali, hạ Natri máu) và thể tích nước tiểu.'
                    }
                ],
                get filteredDrugs() {
                    return this.drugs.filter(item => {
                        let searchLower = this.search.toLowerCase();
                        let matchesSearch = item.name.toLowerCase().includes(searchLower) || 
                                          item.category.toLowerCase().includes(searchLower) ||
                                          (item.brand && item.brand.toLowerCase().includes(searchLower)) ||
                                          (item.dosage && item.dosage.toLowerCase().includes(searchLower)) ||
                                          (item.notes && item.notes.toLowerCase().includes(searchLower));
                        
                        let matchesCategory = this.selectedCategory === 'TẤT CẢ' || item.category === this.selectedCategory;
                        
                        return matchesSearch && matchesCategory;
                    });
                }
            }
        }
    </script>
</body>
</html>
