<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THUỐC SƠ SINH - Tra Cứu Liều NICU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="drugApp()">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-teal-700 via-blue-800 to-indigo-900 p-4 shadow-xl sticky top-0 z-50 border-b border-teal-600/30">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-yellow-400 text-2xl">🍼</span>
        <h1 class="text-xl font-extrabold text-white tracking-wide">THUỐC SƠ SINH</h1>
      </div>
      <span class="text-xs bg-teal-900/80 px-3 py-1 rounded-full text-teal-200 border border-teal-400/40 font-semibold">NICU Clinical Datasets v8.0</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto w-full p-4 flex-1 space-y-6">

    <!-- TRA CỨU DANH MỤC THUỐC SƠ SINH -->
    <section class="bg-slate-900/90 border border-slate-700 rounded-2xl p-5 shadow-2xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
        <h2 class="text-lg font-bold text-teal-400 flex items-center gap-2">
          📚 Tra Cứu Toàn Bộ Danh Mục THUỐC SƠ SINH Chuẩn Y Khoa
        </h2>
        <div class="w-full md:w-64">
          <input type="text" x-model="searchQuery" placeholder="Tìm tên thuốc, chỉ định..." 
                 class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none focus:border-teal-400">
        </div>
      </div>

      <!-- DANH SÁCH THUỐC -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[700px] overflow-y-auto pr-1">
        <template x-for="(drug, key) in filteredDrugs" :key="key">
          <div class="bg-slate-950/80 border border-slate-800 hover:border-teal-500/50 rounded-xl p-4 space-y-3 transition shadow-md">
            
            <!-- TÊN THUỐC & NHÓM -->
            <div class="flex justify-between items-start border-b border-slate-800 pb-2">
              <div>
                <h3 class="text-base font-extrabold text-teal-300" x-text="drug.name"></h3>
                <p class="text-xs text-slate-400" x-text="'Hàm lượng: ' + drug.concentration"></p>
              </div>
              <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider bg-teal-950 text-teal-300 border border-teal-800" x-text="drug.category"></span>
            </div>

            <!-- LIỀU LƯỢNG (CHI TIẾT TUỔI THAI / CÂN NẶNG) -->
            <div class="bg-slate-900/90 p-3 rounded-lg border border-slate-800 text-xs space-y-1">
              <strong class="text-amber-300 block uppercase tracking-wide text-[11px] mb-1">💊 Liều lượng (Theo tuần tuổi thai / cân nặng):</strong>
              <p class="text-slate-200 whitespace-pre-line" x-text="drug.doseDetails"></p>
            </div>

            <!-- CÁC THÔNG TIN CHI TIẾT THEO CẤU TRÚC GỐC -->
            <div class="text-xs space-y-2">
              <div class="flex gap-2">
                <span class="font-bold text-slate-400 min-w-[80px]">Đường dùng:</span>
                <span class="text-emerald-300 font-semibold" x-text="drug.route"></span>
              </div>
              <div class="flex gap-2">
                <span class="font-bold text-slate-400 min-w-[80px]">Liều tối đa:</span>
                <span class="text-red-300 font-semibold" x-text="drug.maxDose"></span>
              </div>
              <div class="flex gap-2">
                <span class="font-bold text-slate-400 min-w-[80px]">Cách pha:</span>
                <span class="text-slate-200" x-text="drug.mixing"></span>
              </div>
              <div class="bg-amber-950/30 border border-amber-500/20 p-2 rounded text-amber-200">
                <strong>⚠️ Lưu ý:</strong> <span x-text="drug.note"></span>
              </div>
              <div class="bg-blue-950/30 border border-blue-500/20 p-2 rounded text-blue-200">
                <strong>🎯 Chỉ định:</strong> <span x-text="drug.indication"></span>
              </div>
            </div>

          </div>
        </template>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 p-4 border-t border-slate-800 text-center text-xs text-slate-500">
    THUỐC SƠ SINH - NICU Toolkit & Reference System
  </footer>
